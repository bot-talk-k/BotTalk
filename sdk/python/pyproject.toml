[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "bottalk"
version = "0.1.0"
description = "Python SDK for bot-talk.com -- push messages to WeChat"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "bottalk contributors"},
]
keywords = ["wechat", "push", "notification", "server-chan"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications",
]

[project.urls]
Homepage = "https://bot-talk.com"
Repository = "https://github.com/bot-talk-k/BotTalk"

[tool.setuptools.packages.find]
include = ["bottalk*"]
