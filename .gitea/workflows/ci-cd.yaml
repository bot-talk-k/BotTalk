name: CI - Lint & Test
on:
  push:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    container: node:20-bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install build tools
        run: apt-get update && apt-get install -y build-essential python3 && rm -rf /var/lib/apt/lists/*

      - name: Install dependencies
        run: pnpm install

      - name: Verify install
        run: |
          node -e "require('express'); console.log('express OK')"
          node -e "require('axios'); console.log('axios OK')"
          node -e "require('eslint'); console.log('eslint OK')"

      - name: Run linter
        run: node node_modules/eslint/bin/eslint.js .

      - name: Run tests
        run: node --test tests/keepalive-tip.test.js tests/smoke.test.js tests/guard-bash.test.js tests/channel-health.test.js

  # TODO: Add CD (Build & Deploy) job when ready for automated deployment
  # Requires Docker-in-Docker sidecar or host Docker access in the runner
