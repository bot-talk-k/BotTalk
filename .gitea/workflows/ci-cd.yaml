name: CI - Lint & Test
on:
  push:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    container: node:20
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Debug - check installed binaries
        run: |
          echo "=== node_modules/.bin contents ==="
          ls -la node_modules/.bin/ 2>&1 || echo "NO .bin DIR"
          echo "=== eslint bin location ==="
          find node_modules/eslint/bin -type f 2>&1 || echo "NO eslint/bin"
          echo "=== node version ==="
          node --version
          echo "=== npm version ==="
          npm --version

      - name: Run linter
        run: node node_modules/eslint/bin/eslint.js .

      - name: Run tests
        run: node --test tests/keepalive-tip.test.js tests/smoke.test.js tests/guard-bash.test.js tests/channel-health.test.js

  build:
    name: Build Docker Images
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        run: docker build -t bottalk-app:latest .

      - name: Build feishu
        run: docker build -t bottalk-feishu:latest ./feishu

      - name: Build wecom
        run: docker build -t bottalk-wecom:latest ./wecom

      - name: Build portal
        run: docker build -t bottalk-portal:latest ./portal

      - name: Verify images
        run: docker images | grep bottalk
