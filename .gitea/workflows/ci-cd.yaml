name: CI - Lint & Test
on:
  push:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    container: node:20-bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: apt-get update && apt-get install -y build-essential python3 && rm -rf /var/lib/apt/lists/*

      - name: Install dependencies
        run: npm install --ignore-scripts=false 2>&1 || npm install --ignore-scripts 2>&1

      - name: Verify install
        run: |
          ls node_modules/.bin/ 2>/dev/null && echo "bin dir exists" || echo "NO bin dir"
          node -e "require('express'); console.log('express OK')" 2>&1 || echo "express MISSING"
          node -e "require('axios'); console.log('axios OK')" 2>&1 || echo "axios MISSING"
          node -e "require('eslint'); console.log('eslint OK')" 2>&1 || echo "eslint MISSING"

      - name: Run linter
        run: node node_modules/eslint/bin/eslint.js .

      - name: Run tests
        run: node --test tests/keepalive-tip.test.js tests/smoke.test.js tests/guard-bash.test.js tests/channel-health.test.js

  build:
    name: Build Docker Images
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        run: docker build -t bottalk-app:latest .

      - name: Build feishu
        run: docker build -t bottalk-feishu:latest ./feishu

      - name: Build wecom
        run: docker build -t bottalk-wecom:latest ./wecom

      - name: Build portal
        run: docker build -t bottalk-portal:latest ./portal

      - name: Verify images
        run: docker images | grep bottalk
