name: CI/CD - Lint, Test & Deploy
on:
  push:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    container: node:20-bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install build tools
        run: apt-get update && apt-get install -y build-essential python3 && rm -rf /var/lib/apt/lists/*

      - name: Install dependencies
        run: pnpm install

      - name: Verify install
        run: |
          node -e "require('express'); console.log('express OK')"
          node -e "require('axios'); console.log('axios OK')"
          node -e "require('eslint'); console.log('eslint OK')"

      - name: Run linter
        run: node node_modules/eslint/bin/eslint.js .

      - name: Run tests
        run: node --test tests/keepalive-tip.test.js tests/smoke.test.js tests/guard-bash.test.js tests/channel-health.test.js

  deploy-dev:
    name: Deploy to Dev
    needs: lint-and-test
    runs-on: ubuntu-latest
    container:
      image: bitnami/kubectl:1.32
    steps:
      - uses: actions/checkout@v4

      - name: Verify k8s access
        run: kubectl get pods -n bottalk-dev

      - name: Deploy to dev namespace
        run: kubectl apply -n bottalk-dev -f k8s/dev-deploy.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/bottalk-app -n bottalk-dev --timeout=120s
          kubectl rollout status deployment/bottalk-feishu -n bottalk-dev --timeout=120s
          kubectl rollout status deployment/bottalk-wecom -n bottalk-dev --timeout=120s
          kubectl rollout status deployment/bottalk-portal -n bottalk-dev --timeout=120s

      - name: Verify deployment
        run: kubectl get pods -n bottalk-dev -o wide
