name: CI - Lint & Test
on:
  push:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    container: node:20-bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install build tools
        run: apt-get update && apt-get install -y build-essential python3 && rm -rf /var/lib/apt/lists/*

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Rebuild native modules
        run: pnpm rebuild 2>&1

      - name: Verify install
        run: |
          node -e "require('express'); console.log('express OK')"
          node -e "require('axios'); console.log('axios OK')"
          node -e "require('eslint'); console.log('eslint OK')"

      - name: Run linter
        run: node node_modules/eslint/bin/eslint.js .

      - name: Run tests
        run: node --test tests/keepalive-tip.test.js tests/smoke.test.js tests/guard-bash.test.js tests/channel-health.test.js

  build:
    name: Build Docker Images
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        run: docker build -t bottalk-app:latest .

      - name: Build feishu
        run: docker build -t bottalk-feishu:latest ./feishu

      - name: Build wecom
        run: docker build -t bottalk-wecom:latest ./wecom

      - name: Build portal
        run: docker build -t bottalk-portal:latest ./portal

      - name: Verify images
        run: docker images | grep bottalk
