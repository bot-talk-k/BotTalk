# BotTalk k3s nginx config
# Location: /etc/nginx/conf.d/bottalk.conf
# Traffic: jakarta_lq (100.86.149.92) -> homevps:80

# Prod (bot-talk.com)
server {
    listen 80;
    server_name bot-talk.com www.bot-talk.com bot-talk.back2china.net;

    location /feishu-app/ {
        proxy_pass http://10.44.0.31:30101/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /wecom-app/ {
        proxy_pass http://10.44.0.31:30102/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://10.44.0.31:30100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Dev (dev.bot-talk.com) -> NodePort 30200 on k8s-cp
