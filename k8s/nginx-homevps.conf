# BotTalk k3s 反代配置
# 位置: /etc/nginx/conf.d/bottalk.conf
# 作用: 将 bot-talk.com 及测试域名反代到 k3s NodePort
# 流量来源: 雅加达阿里云 jakarta_lq (Tailscale 100.86.149.92) → homevps:80
#
# 部署:
#   1. sudo cp bottalk.conf /etc/nginx/conf.d/
#   2. sudo nginx -t
#   3. sudo nginx -s reload

# 主站 (bot-talk.com + 测试域名)
server {
    listen 80;
    server_name bot-talk.com www.bot-talk.com dev.bot-talk.com bot-talk.back2china.net;

    # 飞书通道 app 代理
    location /feishu-app/ {
        proxy_pass http://10.44.0.31:30101/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 企业微信通道 app 代理
    location /wecom-app/ {
        proxy_pass http://10.44.0.31:30102/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://10.44.0.31:30100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# 飞书站 (feishu.bot-talk.com + 测试域名)
server {
    listen 80;
    server_name feishu.bot-talk.com feishu.bot-talk.back2china.net;

    location / {
        proxy_pass http://10.44.0.31:30101;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 企业微信站 (wecom.bot-talk.com + 测试域名)
server {
    listen 80;
    server_name wecom.bot-talk.com wecom.bot-talk.back2china.net;

    location / {
        proxy_pass http://10.44.0.31:30102;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 门户 (portal.bot-talk.com + 测试域名)
server {
    listen 80;
    server_name portal.bot-talk.com portal.bot-talk.back2china.net;

    location / {
        proxy_pass http://10.44.0.31:30103;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
