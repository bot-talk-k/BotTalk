# 阿里云 back2china_lq nginx 配置
# 位置: /usr/local/nginx/conf/vhost/bot-talk.com.conf
# 作用: TLS 终结 + 反代到 homevps (via Tailscale 100.101.255.120)
#
# 部署步骤:
#   1. sudo cp bot-talk.com.conf /usr/local/nginx/conf/vhost/
#   2. sudo nginx -t
#   3. sudo nginx -s reload
#
# 前置: SSL 证书需要放到 /usr/local/nginx/conf/ssl/ 目录
#   可以从 RackNerd 服务器复制, 或者用 acme.sh 重新申请
#   (DNS 已指向阿里云 IP 后才能用 HTTP-01 验证)

# ── HTTP → HTTPS 重定向 ──
server {
    listen 80;
    server_name bot-talk.com www.bot-talk.com
                feishu.bot-talk.com wecom.bot-talk.com portal.bot-talk.com;

    location /.well-known { allow all; }
    location / { return 301 https://$host$request_uri; }
}

# ── bot-talk.com (主站) ──
server {
    listen 443 ssl http2;
    server_name bot-talk.com www.bot-talk.com;

    ssl_certificate     /usr/local/nginx/conf/ssl/bot-talk.com.crt;
    ssl_certificate_key /usr/local/nginx/conf/ssl/bot-talk.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://100.101.255.120:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

