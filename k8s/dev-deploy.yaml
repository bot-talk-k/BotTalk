apiVersion: apps/v1
kind: Deployment
metadata:
  name: bottalk-app
  labels:
    app.kubernetes.io/name: bottalk-app
    app.kubernetes.io/part-of: bottalk
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bottalk-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bottalk-app
        app.kubernetes.io/part-of: bottalk
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-cp
      containers:
        - name: bottalk-app
          image: bottalk-app:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: bottalk-config
            - secretRef:
                name: bottalk-secret
          env:
            - name: PORT
              value: "3000"
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /api/config
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/config
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bottalk-data
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: bottalk-app
spec:
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30200
  selector:
    app.kubernetes.io/name: bottalk-app
---
