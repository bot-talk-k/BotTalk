# BotTalk 主站 Deployment + Service
# 应用: kubectl apply -f k8s/app-deployment.yaml -n bottalk
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bottalk-app
  namespace: bottalk
  labels:
    app.kubernetes.io/name: bottalk-app
    app.kubernetes.io/part-of: bottalk
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bottalk-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bottalk-app
        app.kubernetes.io/part-of: bottalk
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: bottalk-app
          # Rendered by scripts/release-k8s2.sh; do not apply this template directly.
          image: bottalk-app:__RELEASE_SHA__
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: bottalk-config
            - secretRef:
                name: bottalk-secret
          env:
            - name: PORT
              value: "3000"
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: /healthz
              port: 3000
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bottalk-data
      restartPolicy: Always
---
apiVersion: v1
kind: Service
# REFERENCE-ONLY / INIT-ONLY: the live Service, Ingress, LoadBalancer IP, and
# related infrastructure are Home-Lab owned. Never reapply this document during a release.
metadata:
  name: bottalk-app
  namespace: bottalk
  annotations:
    metallb.io/loadBalancerIPs: 192.168.3.241
  labels:
    app.kubernetes.io/name: bottalk-app
    app.kubernetes.io/part-of: bottalk
spec:
  type: LoadBalancer
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: bottalk-app
