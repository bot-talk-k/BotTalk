# BotTalk 敏感配置
# ️ 部署前必须修改！用 base64 编码后的值替换
# 生成方式: echo -n 'your-secret' | base64
# 应用: kubectl apply -f k8s/secret.yaml -n bottalk
apiVersion: v1
kind: Secret
metadata:
  name: bottalk-secret
  namespace: bottalk
  labels:
    app.kubernetes.io/part-of: bottalk
type: Opaque
stringData:
  # ── Session 签名密钥 (必须改,用随机字符串) ──
  # 生成: openssl rand -hex 32
  SESSION_SECRET: "CHANGE_ME_TO_A_RANDOM_SECRET"

  # ── 内部统计 token (portal 拉各渠道 stats,可选) ──
  INTERNAL_STATS_TOKEN: ""

  # ── 超管飞书 SendKey (可选) ──
  SUPERADMIN_FEISHU_SENDKEY: ""

  # ── Portal 超管密码 (可选) ──
  PORTAL_ADMIN_PASSWORD: ""
