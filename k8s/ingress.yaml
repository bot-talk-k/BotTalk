# BotTalk Ingress (Traefik via k3s)
# 4 个子域名各路由到对应 Service
# 应用: kubectl apply -f k8s/ingress.yaml -n bottalk
#
# TLS 由阿里云 nginx (back2china_lq) 统一处理, k8s 内部纯 HTTP
# 流量链路: 用户 → 阿里云(443 TLS) → Tailscale → homevps(nginx:80) → k3s(Traefik) → Pod
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bottalk-app
  namespace: bottalk
  labels:
    app.kubernetes.io/name: bottalk-app
    app.kubernetes.io/part-of: bottalk
spec:
  rules:
    - host: bot-talk.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bottalk-app
                port:
                  number: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bottalk-feishu
  namespace: bottalk
  labels:
    app.kubernetes.io/name: bottalk-feishu
    app.kubernetes.io/part-of: bottalk
spec:
  rules:
    - host: feishu.bot-talk.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bottalk-feishu
                port:
                  number: 3000
---
apiVersion: networking.k8s.io/v1
