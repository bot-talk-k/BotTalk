                port:
                  number: 3000
# BotTalk Ingress (Traefik via k3s)
# 4 个子域名各路由到对应 Service, TLS 由 cert-manager + Let's Encrypt 自动管理
# 应用: kubectl apply -f k8s/ingress.yaml -n bottalk
#
# 前置: 先 apply cert-issuer.yaml (ClusterIssuer)
# 首次建议用 staging: 把 annotation 改为 letsencrypt-staging, 验证后再改 prod
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bottalk-app
  namespace: bottalk
  labels:
    app.kubernetes.io/name: bottalk-app
    app.kubernetes.io/part-of: bottalk
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    traefik.ingress.kubernetes.io/router.middlewares: bottalk-redirect-https@kubernetescrd
spec:
  tls:
    - hosts:
        - bot-talk.com
      secretName: bottalk-app-tls
  rules:
    - host: bot-talk.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bottalk-app
                port:
                  number: 3000
