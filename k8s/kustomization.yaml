# BotTalk k3s 一键部署
# 用法: kubectl apply -k k8s/
# 或按顺序: namespace → configmap/secret → pvc → middleware → cert-issuer → deployments → ingress
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bottalk

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - pvc.yaml
  - middleware.yaml
  - app-deployment.yaml
  - feishu-deployment.yaml
  - wecom-deployment.yaml
  - portal-deployment.yaml
  - ingress.yaml

# cert-issuer 是 cluster-scoped, 不包含在 kustomization 里
# 需要单独: kubectl apply -f k8s/cert-issuer.yaml

commonLabels:
  app.kubernetes.io/part-of: bottalk
  app.kubernetes.io/managed-by: kustomize
