# Bootstrap-only k8s resource bundle. Do not use this for an application release:
# it contains PVC, Service, Ingress, ConfigMap, and Secret resources. Releases use
# scripts/release-k8s2.sh to render and update Deployments only.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bottalk

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - pvc.yaml
  - middleware.yaml
  - app-deployment.yaml
  - feishu-deployment.yaml
  - wecom-deployment.yaml
  - portal-deployment.yaml
  - ingress.yaml

# cert-issuer 是 cluster-scoped, 不包含在 kustomization 里
# 需要单独: kubectl apply -f k8s/cert-issuer.yaml

commonLabels:
  app.kubernetes.io/part-of: bottalk
  app.kubernetes.io/managed-by: kustomize
