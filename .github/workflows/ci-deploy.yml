name: CI Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Smoke tests
        env:
          UNSKIP_DB_TEST: '1'
        run: npm test

  release-policy:
    name: Manual k8s2 Release Policy
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "CI validates source only."
          echo "Production release is manual: scripts/release-k8s2.sh --preflight <sha7>"
          echo "See docs/production-k8s2-release.md."
