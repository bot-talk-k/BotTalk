name: Build & Deploy to Dev

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI Tests
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read

  build:
    name: Build & Push
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [app, feishu, wecom, portal]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service == 'app' && '.' || matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/bottalk-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/bottalk-${{ matrix.service }}:dev
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          no-cache: true

  deploy-dev:
    name: Deploy to Dev
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.JAKARTA_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.JAKARTA_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy to bottalk-dev
        env:
          SHA: ${{ github.sha }}
          REGISTRY: ghcr.io/${{ github.repository_owner }}
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.JAKARTA_SSH_USER }}@${{ secrets.JAKARTA_SSH_HOST }} \
            "ssh root@homevps '
              NAMESPACE=bottalk-dev
              echo \"── Pulling images from GHCR ──\"
              for svc in app feishu wecom portal; do
                echo "Pulling bottalk-\$svc..."
                sudo ctr -n k8s.io images pull ${REGISTRY}/bottalk-\$svc:${SHA} 2>&1 || echo "WARN: pull failed for \$svc"
                sudo ctr -n k8s.io images tag ${REGISTRY}/bottalk-\$svc:${SHA} bottalk-\$svc:latest 2>/dev/null || true
              done
              echo \"── Updating deployments ──\"
              for svc in app feishu wecom portal; do
                kubectl set image deployment/bottalk-\$svc \
                  bottalk-\$svc=bottalk-\$svc:latest \
                  -n \$NAMESPACE
              done
              echo \"─── Rolling out ──\"
              for svc in app feishu wecom portal; do
                kubectl rollout status deployment/bottalk-\$svc -n \$NAMESPACE --timeout=120s
              done
              echo \"─── Dev pods ───\"
              kubectl get pods -n \$NAMESPACE
            '"

      - name: Verify dev site
        run: |
          sleep 5
          for domain in dev.bot-talk.com dev.bot-talk.com/feishu-app/ dev.bot-talk.com/wecom-app/; do
            CODE=$(curl -sf -o /dev/null -w "%{http_code}" "https://$domain" || echo "fail")
            echo "$domain → $CODE"
          done
