name: Docker Build Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI validates buildability only. It does not push images or deploy.
jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [app, feishu, wecom, portal]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service == 'app' && '.' || matrix.service }}
          push: false
          tags: bottalk-${{ matrix.service }}:ci
