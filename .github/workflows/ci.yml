name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_call: {}

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      server: ${{ steps.filter.outputs.server }}
      feishu: ${{ steps.filter.outputs.feishu }}
      wecom: ${{ steps.filter.outputs.wecom }}
      python-sdk: ${{ steps.filter.outputs.python-sdk }}
      node-sdk: ${{ steps.filter.outputs.node-sdk }}
      go-sdk: ${{ steps.filter.outputs.go-sdk }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'app.js'
              - 'db.js'
              - 'scheduler.js'
              - 'ilink.js'
              - 'package*.json'
              - 'routes/**'
              - 'services/**'
              - 'middleware/**'
              - 'public/**'
              - 'eslint.config.js'
              - 'tests/**'
              - '.github/workflows/ci.yml'
            feishu:
              - 'feishu/**'
            wecom:
              - 'wecom/**'
            python-sdk:
              - 'sdk/python/**'
            node-sdk:
              - 'sdk/node/**'
            go-sdk:
              - 'sdk/go/**'

  server:
    name: Server
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Smoke tests
        env:
          UNSKIP_DB_TEST: '1'
        run: npm test

      - name: Verify server starts (legacy)
        run: |
          node app.js &
          SERVER_PID=$!
          sleep 5
          curl -sf http://localhost:3000/ > /dev/null
          kill $SERVER_PID

  feishu:
    name: Feishu
    needs: changes
    if: needs.changes.outputs.feishu == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: feishu
        run: npm install

      - name: Lint
        working-directory: feishu
        run: npm run lint

      - name: Smoke tests
        working-directory: feishu
        run: npm test

  wecom:
    name: WeCom
    needs: changes
    if: needs.changes.outputs.wecom == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: wecom
        run: npm install

      - name: Lint
        working-directory: wecom
        run: npm run lint

      - name: Smoke tests
        working-directory: wecom
        run: npm test

  python-sdk:
    name: Python SDK (${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.python-sdk == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: sdk/python
        run: pip install -e .

      - name: Run tests
        working-directory: sdk/python
        run: python -m unittest discover -s tests -v

  node-sdk:
    name: Node SDK (Node ${{ matrix.node-version }})
    needs: changes
    if: needs.changes.outputs.node-sdk == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: sdk/node/package.json

      - name: Install dependencies
        working-directory: sdk/node
        run: npm ci

      - name: Run tests
        working-directory: sdk/node
        run: node --experimental-strip-types --no-warnings --test tests/*.test.ts

  go-sdk:
    name: Go SDK (Go ${{ matrix.go-version }})
    needs: changes
    if: needs.changes.outputs.go-sdk == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.21', '1.22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: sdk/go/go.sum

      - name: Run tests
        working-directory: sdk/go
        run: go test -v ./...

  domain-consistency:
    name: Domain Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check HTML files use unified domain
        run: node tests/domain-consistency.test.js
