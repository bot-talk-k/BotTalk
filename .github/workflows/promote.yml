name: Production Deployment Disabled

on:
  workflow_dispatch:

# Direct production release is intentionally manual and SHA-gated.
# See docs/production-k8s2-release.md and scripts/release-k8s2.sh.
jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "GitHub Actions production deployment is disabled by policy."
          echo "Use the documented manual k8s2 release process after explicit approval."
